<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue - Site Familial</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .nav-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background-color: #f1f5f9;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      border-radius: 0.75rem;
      transition: all 0.2s ease-in-out;
      border: 1px solid #e2e8f0;
    }

    .nav-button:hover {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .arrow {
      font-size: 1.1rem;
      transition: transform 0.2s ease;
    }

    .nav-button:hover .arrow {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Bienvenue sur le site de la famille</h1>
    <p class="subtitle">Mis à jour le 7 octobre 2026</p>
    
    <nav class="nav-links">
      <a href="Famille/Accueil.html" class="nav-button">
        <span>Histoires de Famille</span>
        <span class="arrow">&rarr;</span>
      </a>
      <a href="USA/Accueil.html" class="nav-button">
        <span>Ouest Américain</span>
        <span class="arrow">&rarr;</span>
      </a>
      <a href="NY/index.html" class="nav-button">
        <span>New York</span>
        <span class="arrow">&rarr;</span>
      </a>
    </nav>
  </main>

</body>
</html>
